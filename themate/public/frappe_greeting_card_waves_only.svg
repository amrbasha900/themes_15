<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 210" width="1600" height="210" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="greetingTitle greetingDesc">
  <title id="greetingTitle">Frappe Greeting Banner — editable SVG background</title>
  <desc id="greetingDesc">A gentle pearl-to-sky gradient with lilac and periwinkle flowing waves with generous calm space for overlay text. No greeting text. Every illustration element is vector, and the seven palette variables below are editable.</desc>
  <style><![CDATA[
    /* COLOR PALETTE: edit these values or use the included HTML editor. */
    svg {
      --surface: #FCFDFF;
      --mist: #EEEFFE;
      --sky: #BED7FF;
      --lavender: #AFBAF7;
      --blue: #8DB7FA;
      --indigo: #576CE9;
      --cyan: #51BDFF;
    }
    .c-surface { stop-color:var(--surface); }
    .c-mist { stop-color:var(--mist); }
    .c-sky { stop-color:var(--sky); }
    .c-lavender { stop-color:var(--lavender); }
    .c-blue { stop-color:var(--blue); }
    .c-indigo { stop-color:var(--indigo); }
    .c-cyan { stop-color:var(--cyan); }
    .fill-indigo { fill:var(--indigo); }
    .fill-blue { fill:var(--blue); }
    .stroke-indigo { stroke:var(--indigo); }
    .stroke-blue { stroke:var(--blue); }
  ]]></style>
  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="1600" height="210" rx="23"/></clipPath>
    <linearGradient id="canvas" x1="0" y1="0.35" x2="1" y2="0.62" gradientUnits="objectBoundingBox">
      <stop offset="0" class="c-surface"/>
      <stop offset="0.32" class="c-mist" stop-opacity="0.67"/>
      <stop offset="0.58" class="c-mist" stop-opacity="0.81"/>
      <stop offset="1" class="c-sky"/>
    </linearGradient>
    <linearGradient id="topshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="c-surface" stop-opacity="0.48"/>
      <stop offset="0.62" class="c-surface" stop-opacity="0.03"/>
      <stop offset="1" class="c-surface" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="65%" cy="50%" r="70%">
      <stop offset="0" class="c-surface" stop-opacity="0.62"/>
      <stop offset="0.5" class="c-lavender" stop-opacity="0.12"/>
      <stop offset="1" class="c-surface" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveBack" x1="0" y1="0" x2="0.84" y2="1">
      <stop offset="0" class="c-surface" stop-opacity="0.15"/>
      <stop offset="0.43" class="c-lavender" stop-opacity="0.53"/>
      <stop offset="1" class="c-blue" stop-opacity="0.69"/>
    </linearGradient>
    <linearGradient id="waveMid" x1="0" y1="0.2" x2="0.94" y2="1">
      <stop offset="0" class="c-surface" stop-opacity="0.12"/>
      <stop offset="0.3" class="c-lavender" stop-opacity="0.45"/>
      <stop offset="0.76" class="c-indigo" stop-opacity="0.45"/>
      <stop offset="1" class="c-blue" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="waveFront" x1="0" y1="0" x2="0.78" y2="1">
      <stop offset="0" class="c-surface" stop-opacity="0.02"/>
      <stop offset="0.34" class="c-lavender" stop-opacity="0.36"/>
      <stop offset="0.7" class="c-blue" stop-opacity="0.64"/>
      <stop offset="1" class="c-indigo" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="waveRight" x1="0.05" y1="1" x2="0.95" y2="0">
      <stop offset="0" class="c-lavender" stop-opacity="0.38"/>
      <stop offset="0.43" class="c-blue" stop-opacity="0.54"/>
      <stop offset="1" class="c-sky" stop-opacity="0.93"/>
    </linearGradient>
    <linearGradient id="waveLip" x1="0" y1="0" x2="0.95" y2="0.9">
      <stop offset="0" class="c-surface" stop-opacity="0.0"/>
      <stop offset="0.48" class="c-surface" stop-opacity="0.37"/>
      <stop offset="1" class="c-sky" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="deepCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="c-lavender"/>
      <stop offset="0.36" class="c-indigo"/>
      <stop offset="1" class="c-cyan"/>
    </linearGradient>
    <linearGradient id="deepCardEdge" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" class="c-lavender"/>
      <stop offset="1" class="c-indigo"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="c-surface"/>
      <stop offset="0.65" class="c-surface"/>
      <stop offset="1" class="c-sky" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="cardSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="c-mist"/>
      <stop offset="0.72" class="c-blue"/>
      <stop offset="1" class="c-indigo"/>
    </linearGradient>
    <linearGradient id="plotPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="c-surface"/>
      <stop offset="1" class="c-mist"/>
    </linearGradient>
    <linearGradient id="plotBlue" x1="0" y1="1" x2="0.25" y2="0">
      <stop offset="0" class="c-indigo"/>
      <stop offset="1" class="c-cyan"/>
    </linearGradient>
    <linearGradient id="plotRing" x1="0.05" y1="0.08" x2="0.92" y2="0.91">
      <stop offset="0" class="c-cyan"/>
      <stop offset="0.48" class="c-blue"/>
      <stop offset="1" class="c-indigo"/>
    </linearGradient>
    <filter id="blueGlow" x="-75%" y="-75%" width="250%" height="250%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softDrop" x="-60%" y="-70%" width="260%" height="270%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#5369B8" flood-opacity="0.24"/>
    </filter>
    <filter id="miniDrop" x="-60%" y="-70%" width="260%" height="270%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6B86BF" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1600" height="210" fill="url(#canvas)"/>
    <rect width="1600" height="210" fill="url(#topshine)"/>
    <ellipse cx="1040" cy="100" rx="430" ry="210" fill="url(#moonGlow)"/>

    <!-- Organic waves: intentional calm space left for greeting text -->
    <g id="greeting-waves">
      <path d="M645 210 C800 208 886 140 1005 78 C1119 17 1179 49 1302 120 C1433 198 1499 176 1600 85 L1600 210Z" fill="url(#waveBack)" opacity="0.82"/>
      <path d="M813 210 C921 197 980 128 1082 140 C1192 146 1245 224 1367 211 C1456 202 1543 145 1600 120 L1600 210 Z" fill="url(#waveMid)" opacity="0.90"/>
      <path d="M1140 210 C1262 190 1277 127 1387 138 C1466 147 1532 205 1600 136 L1600 210Z" fill="url(#waveFront)" opacity="0.77"/>
      <path d="M1332 210 C1400 173 1492 132 1600 61 L1600 210 Z" fill="url(#waveRight)" opacity="0.94"/>
      <path d="M782 210 C908 208 960 132 1095 145 C1197 155 1243 221 1380 210" fill="none" stroke="url(#waveLip)" stroke-width="2" opacity="0.55"/>
      <ellipse cx="1473" cy="181" rx="184" ry="36" fill="url(#waveRight)" opacity="0.26" filter="url(#blueGlow)"/>
    </g>

  </g>
</svg>